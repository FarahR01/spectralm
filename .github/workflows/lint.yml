name: Code Quality

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Lint with ruff
      run: |
        ruff check spectralm scripts tests --max-line-length 100
      continue-on-error: false

    - name: Format check with ruff
      run: |
        ruff format spectralm scripts tests --check --max-line-length 100
      continue-on-error: false

    - name: Type check with mypy
      run: |
        mypy spectralm --ignore-missing-imports
      continue-on-error: true
